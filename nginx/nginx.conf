upstream flask_app {
    # Docker DNS returns one IP per replica of the "app" service;
    # nginx round-robins across them by default.
    server app:5000;
}

server {
    listen 80;

    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
