services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    build: ./app
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      replicas: 3          # 3 identical Flask containers

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
